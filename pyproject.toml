[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "la-maison"
version = "0.1.0"
description = "Répare des projets Python cassés, hors ligne, toujours sur une copie."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[project.scripts]
maison = "maison.cli:main"

[tool.setuptools]
packages = ["maison"]
